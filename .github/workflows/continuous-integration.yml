name: Continuous Integration
run-name: "Continuous Integration ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches: ["main"]
  pull_request:

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.23
      - run: aiken fmt --check
      - run: aiken check -D
      # The assertions env compiles env/with_assertions.ak in place of the
      # default no-op, enforcing assets.collect's documented no-ada
      # pre-condition. Without this step that assertion never executes.
      - run: aiken check -D --env with_assertions
      - run: aiken build
